name: ci
'on':
  - push
  - pull_request
  - workflow_dispatch
jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        node:
          - '22'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run build --if-present
      - run: npm test
  go:
    name: Go build + test
    runs-on: ubuntu-latest
    env:
      # Pure-Go stack (modernc sqlite); CGO toolchains are not required.
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -buildvcs=false ./...
      - run: go vet -buildvcs=false ./...
      - run: go test -buildvcs=false ./cmd/... ./internal/... ./pkg/...
