<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mega-Messenger Mobile</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #0b0f19;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .mobile-frame {
      width: 100%;
      max-width: 420px;
      height: 90vh;
      max-height: 840px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .mobile-header {
      background: #1f2937;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #374151;
    }
    .mobile-header h1 {
      margin: 0;
      font-size: 1.1rem;
      color: #f9fafb;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mobile-status {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      background: #064e3b;
      color: #34d399;
      font-weight: bold;
    }
    .channel-chips {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      background: #161e2e;
      overflow-x: auto;
      border-bottom: 1px solid #1f2937;
    }
    .chip {
      background: #1f2937;
      color: #9ca3af;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      border: 1px solid #374151;
    }
    .chip.active {
      background: #2563eb;
      color: #fff;
      border-color: #3b82f6;
    }
    .messages-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.88rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .bubble.incoming {
      align-self: flex-start;
      background: #1f2937;
      color: #f3f4f6;
      border-bottom-left-radius: 4px;
    }
    .bubble.outgoing {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble .meta {
      font-size: 0.7rem;
      opacity: 0.7;
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .mobile-input-bar {
      padding: 12px 16px;
      background: #1f2937;
      border-top: 1px solid #374151;
      display: flex;
      gap: 8px;
    }
    .mobile-input-bar input {
      flex: 1;
      background: #111827;
      border: 1px solid #374151;
      padding: 10px 14px;
      border-radius: 20px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    .mobile-input-bar input:focus {
      border-color: #3b82f6;
    }
    .mobile-input-bar button {
      background: #2563eb;
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
    }
    .mobile-input-bar button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">
    <div class="mobile-header">
      <h1>💬 Mega-Messenger</h1>
      <span id="bridge-status" class="mobile-status">Bridge: ONLINE</span>
    </div>
    <div class="channel-chips" id="topic-chips">
      <div class="chip active" data-topic="global"># global</div>
      <div class="chip" data-topic="announcements"># announcements</div>
      <div class="chip" data-topic="market"># market</div>
      <div class="chip" data-topic="support"># support</div>
    </div>
    <div class="messages-area" id="chat-messages">
      <div class="bubble incoming">
        <div class="text">Welcome to the Mega-Messenger light client preview. Connected via local Heavy Node WebSocket bridge.</div>
        <div class="meta"><span>Control Plane</span><span>Just now</span></div>
      </div>
    </div>
    <form class="mobile-input-bar" id="chat-form">
      <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" required>
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const clientId = 'mobile-ui-' + Math.random().toString(36).substring(2, 9);
    let currentTopic = 'global';
    let socket = null;

    const messagesArea = document.getElementById('chat-messages');
    const msgInput = document.getElementById('msg-input');
    const statusEl = document.getElementById('bridge-status');

    function connect() {
      const loc = window.location;
      const wsUrl = (loc.protocol === 'https:' ? 'wss://' : 'ws://') + loc.host + '/mega-bridge?client_id=' + clientId;
      socket = new WebSocket(wsUrl);

      socket.onopen = () => {
        statusEl.textContent = 'Bridge: CONNECTED';
        statusEl.style.background = '#064e3b';
        statusEl.style.color = '#34d399';
        joinTopic(currentTopic);
      };

      socket.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'message' && msg.topic === currentTopic) {
            renderMessage(msg.data, false, msg.sender);
          } else if (msg.type === 'history' && msg.topic === currentTopic && Array.isArray(msg.history)) {
            msg.history.forEach(item => {
              renderMessage(item.content, false, item.sender_id || 'peer');
            });
          }
        } catch (e) {
          console.error('Failed to parse bridge msg:', e);
        }
      };

      socket.onclose = () => {
        statusEl.textContent = 'Bridge: DISCONNECTED';
        statusEl.style.background = '#7f1d1d';
        statusEl.style.color = '#f87171';
        setTimeout(connect, 3000);
      };
    }

    function joinTopic(topic) {
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ action: 'join', topic: topic }));
        socket.send(JSON.stringify({ action: 'history', topic: topic, limit: 30 }));
      }
    }

    function renderMessage(text, isOutgoing, sender) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + (isOutgoing ? 'outgoing' : 'incoming');

      const textDiv = document.createElement('div');
      textDiv.className = 'text';
      textDiv.textContent = typeof text === 'string' ? text : JSON.stringify(text);

      const metaDiv = document.createElement('div');
      metaDiv.className = 'meta';
      metaDiv.innerHTML = `<span>${sender || (isOutgoing ? 'Me' : 'Peer')}</span><span>${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>`;

      bubble.appendChild(textDiv);
      bubble.appendChild(metaDiv);
      messagesArea.appendChild(bubble);
      messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentTopic = chip.getAttribute('data-topic');
        messagesArea.innerHTML = '';
        joinTopic(currentTopic);
      });
    });

    document.getElementById('chat-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const val = msgInput.value.trim();
      if (!val) return;
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          action: 'publish',
          topic: currentTopic,
          payload: val
        }));
        renderMessage(val, true, 'Me');
        msgInput.value = '';
      }
    });

    connect();
  </script>
</body>
</html>
