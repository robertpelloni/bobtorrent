syntax = "proto3";

package omnimesh.envelope;

option go_package = "bobtorrent/internal/protobuf/envelope";

// Envelope is the standard data envelope specification for Light UI to Heavy Node communication.
// All actions (Chat, Market, Blockchain) are standardized as metadata-blinded payloads.
message Envelope {
  bytes id = 1;                // Unique hash of the payload
  bytes sender_pubkey = 2;     // Public key of the sender
  int64 timestamp = 3;         // Unix timestamp
  bytes signature = 4;         // Sender's signature verifying the payload

  enum Type {
    UNKNOWN = 0;
    CHAT = 1;
    MARKET = 2;
    BLOCKCHAIN = 3;
    SIGNALING = 4;
  }
  Type payload_type = 5;       // Type of the blinded payload
  bytes encrypted_body = 6;    // Encrypted using the recipient's public key (DH/AES-GCM)
}
